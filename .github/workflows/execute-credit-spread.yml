name: Execute Credit Spread (DISABLED)

# KILLED path for freehand credit spreads. Use spy_put_credit paper validation only.
# See data/runtime/strategy_kill_switch.json

on:
  workflow_dispatch:
    inputs:
      acknowledge_killed:
        description: "Type STRATEGY_KILLED to acknowledge this workflow is a no-op"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse freehand credit-spread execution
        run: |
          echo "STRATEGY_KILLED: freehand credit-spread workflow is disabled."
          echo "Successor: python3 scripts/spy_put_credit.py --dry-run  (paper only)"
          echo "Kill switch: data/runtime/strategy_kill_switch.json"
          if [ "${{ github.event.inputs.acknowledge_killed }}" != "STRATEGY_KILLED" ]; then
            echo "Set acknowledge_killed=STRATEGY_KILLED if you only wanted to confirm the kill."
          fi
          exit 1
