name: Autonomous Money Cycle (paper/dry-run)

# Multi-day put-credit manage + bank transfer dry-run plans + dividend growth
# income loop (buy-and-hold DCA). Never enables live Mercury ACH or live broker
# risk without gate clearance (cycle script fail-closes). Default dry-run.

on:
  schedule:
    # Weekday mid-session check (approx 11:15 AM ET = 15:15 UTC)
    - cron: 15 15 * * 1-5
    # Weekday afternoon manage (approx 2:15 PM ET)
    - cron: 15 18 * * 1-5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-money-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements-minimal.txt 2>/dev/null || pip install alpaca-py python-dotenv requests

      - name: Run autonomous trading scheduler (dry-run)
        env:
          ALPACA_PAPER_TRADING_API_KEY: ${{ secrets.ALPACA_PAPER_TRADING_API_KEY }}
          ALPACA_PAPER_TRADING_API_SECRET: ${{ secrets.ALPACA_PAPER_TRADING_API_SECRET }}
          APCA_API_KEY_ID: ${{ secrets.ALPACA_PAPER_TRADING_API_KEY }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_PAPER_TRADING_API_SECRET }}
        run: |
          # Run the unified scheduler which executes:
          # 1. mercury_income_loop.py — buy-and-hold DCA (SCHD) + dividend collection + profit remittance
          # 2. autonomous_money_cycle.py — multi-day put-credit manage + bank transfer dry-run plans
          # 3. remittance_status.py — ledger facts toward $1000/mo after-tax target
          python3 scripts/run_autonomous_trading.py --json

      - name: Run remittance monitor
        run: |
          python3 scripts/monitor_remittance.py --json || true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autonomous-money-cycle-audit
          retention-days: 14
          path: |
            data/audit/autonomous_money_cycle_latest.json
            data/audit/mercury_broker_transfers.jsonl
            data/audit/put_credit_cohort_latest.json
            data/mercury_income_loop_state.json
            logs/autonomous_trading_*.json
          if-no-files-found: ignore
