name: Trigger.dev Tests

on:
  push:
    paths:
      - "trigger/**"
      - "trigger.config.ts"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"
  pull_request:
    paths:
      - "trigger/**"
      - "trigger.config.ts"
      - "package.json"
      - "tsconfig.json"
      - "vitest.config.ts"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run
