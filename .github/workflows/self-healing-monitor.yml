name: System Health Monitor

on:
  schedule:
    # Hourly weekday health signal; execution workflows retain their own safety checks.
    - cron: 17 14-20 * * 1-5
  workflow_dispatch:

permissions:
  contents: read

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: ./.github/actions/setup-uv-python

      - name: Run System Health Check
        id: health_check
        env:
          ALPACA_PAPER_TRADING_API_KEY: ${{ secrets.ALPACA_PAPER_TRADING_API_KEY }}
          ALPACA_PAPER_TRADING_API_SECRET: ${{ secrets.ALPACA_PAPER_TRADING_API_SECRET }}
        run: |
          python3 scripts/self_healing_check.py --json > health_report.json

          # Extract status for job output
          STATUS=$(python3 -c "import json; print(json.load(open('health_report.json'))['overall_status'])")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          # Display report
          python3 scripts/self_healing_check.py

      - name: Upload Health Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: health-report
          path: health_report.json
          retention-days: 7

      - name: Fail closed when semantic health is unhealthy
        if: always() && steps.health_check.outputs.status == 'unhealthy'
        run: |
          echo "::error::Semantic trading health is unhealthy; see health-report artifact."
          exit 1
