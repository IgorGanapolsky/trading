name: System Health Monitor

on:
  schedule:
    # Hourly weekday health signal; execution workflows retain their own safety checks.
    - cron: 17 14-20 * * 1-5
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install alpaca-py python-dotenv

      - name: Run System Health Check
        id: health_check
        env:
          ALPACA_PAPER_TRADING_API_KEY: ${{ secrets.ALPACA_PAPER_TRADING_API_KEY }}
          ALPACA_PAPER_TRADING_API_SECRET: ${{ secrets.ALPACA_PAPER_TRADING_API_SECRET }}
        run: |
          python3 scripts/self_healing_check.py --json > health_report.json

          # Extract status for job output
          STATUS=$(python3 -c "import json; print(json.load(open('health_report.json'))['overall_status'])")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          # Display report
          python3 scripts/self_healing_check.py

      - name: Create Issue if Unhealthy
        if: steps.health_check.outputs.status == 'unhealthy'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('health_report.json', 'utf8'));

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'self-healing'
            });

            const existingIssue = issues.data.find(i =>
              i.title.includes('Self-Healing Alert')
            );

            const body = `## Self-Healing Health Check Failed

            **Status**: ${report.overall_status.toUpperCase()}
            **Time**: ${report.timestamp}

            ### Check Results
            ${report.checks.map(c => `- ${c.status === 'healthy' ? '✅' : c.status === 'degraded' ? '⚠️' : '❌'} **${c.name}**: ${c.message}`).join('\n')}

            ### Action Required
            Please investigate and fix the unhealthy checks.

            ---
            *This issue was auto-generated by the system health monitor.*
            `;

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 System Health Alert: System Unhealthy',
                body: body,
                labels: ['self-healing', 'automated', 'urgent']
              });
            }

      - name: Upload Health Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: health-report
          path: health_report.json
          retention-days: 7

      - name: Fail closed when semantic health is unhealthy
        if: always() && steps.health_check.outputs.status == 'unhealthy'
        run: |
          echo "::error::Semantic trading health is unhealthy; see health-report artifact."
          exit 1
