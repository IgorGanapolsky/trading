name: Verification Gate

# This workflow MUST pass before any merge
# Created after Dec 11, 2025 incident (ll_009)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  pre-merge-verification:
    name: Pre-Merge Verification Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pyyaml numpy
          pip install -e . || true  # Best effort install

      - name: Check 1 - Python Syntax Validation
        run: |
          echo "🔍 Checking all Python files for syntax errors..."
          find src -name "*.py" -exec python3 -m py_compile {} \;
          find scripts -name "*.py" -exec python3 -m py_compile {} \;
          echo "✅ All Python files have valid syntax"

      - name: Check 2 - Critical Import Verification
        run: |
          echo "🔍 Verifying critical trading system imports..."
          python3 << 'EOF'
          import ast
          from pathlib import Path

          critical_files = [
              "src/execution/alpaca_executor.py",
              "src/orchestrator/main.py",
              "src/risk/trade_gateway.py",
              "src/strategies/core_strategy.py",
          ]

          failed = []
          for filepath in critical_files:
              path = Path(filepath)
              if path.exists():
                  try:
                      with open(path) as f:
                          ast.parse(f.read())
                      print(f"✅ {filepath}")
                  except SyntaxError as e:
                      print(f"❌ {filepath}: {e}")
                      failed.append(filepath)
              else:
                  print(f"⚠️ {filepath}: not found")

          if failed:
              print(f"\n🚨 CRITICAL: {len(failed)} file(s) have syntax errors!")
              print("This would break trading. Merge blocked.")
              exit(1)

          print("\n✅ All critical files have valid syntax")
          EOF

      - name: Check 3 - RAG Safety Check
        run: |
          echo "🔍 Checking for similar past incidents..."
          python3 << 'EOF'
          # Get changed files
          import subprocess
          import os

          # Get base branch
          base = os.environ.get("GITHUB_BASE_REF", "main")

          try:
              result = subprocess.run(
                  ["git", "diff", "--name-only", f"origin/{base}...HEAD"],
                  capture_output=True, text=True
              )
              changed_files = result.stdout.strip().split('\n') if result.stdout.strip() else []
          except:
              changed_files = []

          print(f"Changed files: {len(changed_files)}")

          # Check for dangerous patterns
          dangerous_patterns = {
              "alpaca_executor": "Execution layer changes (ll_009)",
              "trade_gateway": "Trade gateway changes",
              "orchestrator/main": "Orchestrator changes",
          }

          warnings = []
          for f in changed_files:
              for pattern, desc in dangerous_patterns.items():
                  if pattern in f.lower():
                      warnings.append(f"⚠️ {f}: {desc}")

          # Large PR warning
          if len(changed_files) > 10:
              warnings.append(f"⚠️ Large PR ({len(changed_files)} files) - requires extra review")

          if warnings:
              print("\n⚠️ RAG SAFETY WARNINGS:")
              for w in warnings:
                  print(f"  {w}")
              print("\nThese patterns have caused issues before. Please verify carefully.")
          else:
              print("✅ No dangerous patterns detected")
          EOF

      - name: Check 4 - Ruff Lint (Critical Errors Only)
        run: |
          echo "🔍 Running lint check for critical errors..."
          ruff check src/ scripts/ --select=E9,F63,F7,F82 --output-format=github
          echo "✅ Lint check complete"

      - name: Check 5 - Verification Tests
        run: |
          echo "🔍 Running verification tests..."
          pytest tests/test_verification_system.py tests/test_lessons_contract.py -v --timeout=60
          echo "✅ Verification tests complete"

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "================================================"
          echo "VERIFICATION GATE SUMMARY"
          echo "================================================"
          echo ""
          echo "This gate prevents incidents like Dec 11, 2025"
          echo "where a syntax error broke all trading."
          echo ""
          echo "See: rag_knowledge/lessons_learned/ll_009_ci_syntax_failure_dec11.md"

  post-merge-health:
    name: Post-Merge Health Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pre-merge-verification

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Trading System Health
        run: |
          echo "🏥 Running post-merge health check..."
          python3 << 'EOF'
          import ast
          from pathlib import Path

          # Quick health check
          critical = [
              "src/orchestrator/main.py",
              "src/execution/alpaca_executor.py",
          ]

          healthy = True
          for f in critical:
              path = Path(f)
              if path.exists():
                  try:
                      with open(path) as file:
                          ast.parse(file.read())
                      print(f"✅ {f}")
                  except SyntaxError as e:
                      print(f"❌ {f}: {e}")
                      healthy = False

          if healthy:
              print("\n✅ Trading system is healthy after merge")
          else:
              print("\n🚨 CRITICAL: Trading system unhealthy!")
              print("Manual intervention required.")
              exit(1)
          EOF
