name: Force Iron Condor Execution (DISABLED)

# KILLED 2026-07-22 with IC Simple. Do not re-enable.
# Successor: scripts/spy_put_credit.py (paper only).
# See data/runtime/strategy_kill_switch.json

on:
  workflow_dispatch:
    inputs:
      acknowledge_killed:
        description: "Type STRATEGY_KILLED to acknowledge this workflow is a no-op"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse iron condor force execution
        run: |
          echo "STRATEGY_KILLED: iron_condor / ic_simple new entries are forbidden."
          echo "This emergency workflow previously ran: iron_condor_trader.py --force --live"
          echo "Successor: python3 scripts/spy_put_credit.py --dry-run  (paper only)"
          echo "Kill switch: data/runtime/strategy_kill_switch.json"
          if [ "${{ github.event.inputs.acknowledge_killed }}" != "STRATEGY_KILLED" ]; then
            echo "Set acknowledge_killed=STRATEGY_KILLED if you only wanted to confirm the kill."
          fi
          exit 1
