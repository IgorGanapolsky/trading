name: SonarCloud

# Static analysis + code-quality + coverage gating via SonarCloud
# (free tier for public repos). Complements the AI PR review workflow
# (semantic review) and OpenSSF Scorecard (supply-chain). Uses the
# SONAR_TOKEN secret already configured at the repo level.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: read-all

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for blame-based new-code analysis

      - name: Set up uv
        uses: ./.github/actions/setup-uv-python
        with:
          extra: dev
      - name: Generate coverage report
        env:
          PYTHON_BIN: python
          REPORT_DIR: artifacts/test-reports
        run: |
          chmod +x scripts/ci/run_all_tests.sh
          bash scripts/ci/run_all_tests.sh

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
