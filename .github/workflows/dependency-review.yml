name: Dependency Review

on:
  pull_request:

permissions: read-all

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  agent-pr-approve:
    name: Agent PR required review
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        contains(github.event.pull_request.body, 'Linear issue: AGENT-') ||
        (
          startsWith(github.event.pull_request.head.ref, 'chore/auto-') &&
          contains(github.event.pull_request.title, '[auto]')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Approve as github-actions
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # dismiss_stale_reviews keeps historical APPROVED rows on old SHAs.
          # GITHUB_TOKEN is github-actions[bot] and cannot approve its own
          # chore/auto-* PRs (GraphQL: Review Can not approve your own pull request).
          any_approved="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" \
            --jq "[.[] | select(.state==\"APPROVED\" and .commit_id==\"${HEAD}\")] | length")"
          if [[ "${any_approved}" != "0" ]]; then
            echo "HEAD already has an APPROVED review"
            exit 0
          fi
          author="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .user.login)"
          if [[ "${author}" == "github-actions[bot]" ]]; then
            echo "bot-authored PR cannot be self-approved by GITHUB_TOKEN; CODEOWNERS still requires a human review"
            exit 0
          fi
          gh pr review "${PR}" --repo "${GITHUB_REPOSITORY}" --approve \
            --body "github-actions[bot] required review for same-repo Linear AGENT PR. Owner cannot self-approve (CODEOWNERS). Required CI checks remain independently enforced."
