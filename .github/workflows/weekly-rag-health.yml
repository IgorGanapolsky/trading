name: Weekly RAG Health Check

on:
  schedule:
    # Every Monday at 10:00 AM UTC (5:00 AM ET)
    - cron: '0 10 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  rag-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install chromadb>=1.3.6 sentence-transformers pytest

      - name: Check RAG Architecture
        run: |
          echo "========================================"
          echo "RAG ARCHITECTURE VALIDATION"
          echo "========================================"
          python scripts/verify_rag_architecture.py

      - name: Run RAG Integration Tests
        run: |
          echo "========================================"
          echo "RAG INTEGRATION TESTS"
          echo "========================================"
          pytest tests/integration/test_rag_quality.py -v --tb=short

      - name: Check ChromaDB Data
        run: |
          python << 'EOF'
          from src.rag.lessons_learned_rag import LessonsLearnedRAG

          rag = LessonsLearnedRAG()

          # Check ChromaDB is being used
          if not rag._use_chromadb:
              print("❌ REGRESSION: RAG not using ChromaDB!")
              exit(1)

          # Check ChromaDB has data
          count = rag._chroma_collection.count() if rag._chroma_collection else 0
          print(f"✅ ChromaDB has {count} documents")

          if count == 0:
              print("❌ WARNING: ChromaDB is empty!")
              exit(1)

          if count < 4:
              print(f"⚠️  WARNING: Only {count} documents (expected ≥4)")

          # Test search functionality
          results = rag.search("position sizing error", top_k=3)
          if not results:
              print("❌ ERROR: Search returned no results!")
              exit(1)

          print(f"✅ Search works: {len(results)} results")
          print(f"   Top result: {results[0][0].title} ({results[0][1]:.0%})")
          EOF

      - name: Verify Cohere Rerank Integration
        run: |
          python << 'EOF'
          from src.rag.lessons_learned_rag import LessonsLearnedRAG

          # Check use_rerank parameter exists
          rag = LessonsLearnedRAG(use_rerank=False)
          assert hasattr(rag, 'use_rerank'), "use_rerank attribute missing!"
          assert hasattr(rag, 'get_cost_summary'), "get_cost_summary() method missing!"

          print("✅ Cohere Rerank integration preserved")
          EOF

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = '⚠️ Weekly RAG Health Check Failed';
            const body = `## RAG Regression Detected

            The weekly RAG health check failed on ${new Date().toISOString()}.

            ### Possible Issues:
            - ChromaDB not being used (reverted to JSON fallback)
            - ChromaDB data missing or corrupted
            - Integration tests failing
            - Architecture validation failing

            ### What to Check:
            1. Verify \`src/rag/lessons_learned_rag.py\` uses ChromaDB
            2. Check \`requirements-minimal.txt\` has \`chromadb>=1.3.6\` (not commented)
            3. Review workflow logs for specific failures
            4. Run tests locally: \`pytest tests/integration/test_rag_quality.py -v\`

            ### Lesson Learned:
            See: \`rag_knowledge/lessons_learned/lesson_20251215_104602_0\`
            Prevention: Always use proper vector databases from day 1.

            ### References:
            - MANDATORY_RULES.md #11: RAG Implementation Rules
            - Integration tests: \`tests/integration/test_rag_quality.py\`
            - Architecture check: \`scripts/verify_rag_architecture.py\`

            cc: @IgorGanapolsky`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rag-regression'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'rag-regression', 'technical-debt', 'high-priority']
              });
              console.log('Created GitHub issue for RAG health check failure');
            } else {
              console.log('RAG regression issue already exists');
            }

      - name: Close Issue on Success
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Close any open RAG regression issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rag-regression'
            });

            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '✅ RAG health check now passing. Closing this issue.'
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });

              console.log(`Closed issue #${issue.number}`);
            }
