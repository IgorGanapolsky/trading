name: Weekly Cadence Fail-Safe

on:
  schedule:
    # Monday 09:40 ET (14:40 UTC) after fresh sync window.
    - cron: "40 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cadence-fail-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-minimal.txt

      - name: Refresh North Star operating plan
        run: python3 scripts/update_north_star_operating_plan.py

      - name: Evaluate strict cadence gate
        id: cadence_check
        continue-on-error: true
        run: |
          mkdir -p artifacts/devloop
          python3 scripts/check_weekly_cadence_gate.py \
            --state data/system_state.json \
            --out artifacts/devloop/weekly_cadence_kpi.md \
            --emit-github-warning \
            --strict

      - name: Build issue summary
        id: cadence_summary
        run: |
          python3 <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          state = json.loads(Path("data/system_state.json").read_text(encoding="utf-8"))
          weekly_gate = state.get("north_star_weekly_gate", {})
          cadence = weekly_gate.get("cadence_kpi", {}) if isinstance(weekly_gate, dict) else {}
          diagnostic = (
              weekly_gate.get("no_trade_diagnostic", {}) if isinstance(weekly_gate, dict) else {}
          )

          today = date.today()
          week_start = today - timedelta(days=today.weekday())

          passed = bool(cadence.get("passed"))
          setups_obs = int(cadence.get("qualified_setups_observed", 0))
          setups_req = int(cadence.get("min_qualified_setups_per_week", 0))
          entries_obs = int(cadence.get("new_entries_observed", 0))
          entries_req = int(cadence.get("min_new_entries_per_week", 0))
          closes_obs = int(cadence.get("closed_trades_observed", 0))
          closes_req = int(cadence.get("min_closed_trades_per_week", 0))
          alert_level = str(cadence.get("alert_level", "unknown"))
          summary = str(cadence.get("summary", "Cadence KPI missing"))

          blocked_categories = diagnostic.get("blocked_categories", [])
          if not isinstance(blocked_categories, list):
              blocked_categories = []
          blocked_text = ", ".join(str(item) for item in blocked_categories) if blocked_categories else "none"

          body = "\n".join(
              [
                  f"# Weekly Cadence KPI Miss ({week_start.isoformat()})",
                  "",
                  "Cadence fail-safe triggered because strict weekly throughput targets were not met.",
                  "",
                  "## Weekly Throughput",
                  f"- Qualified setups: `{setups_obs}/{setups_req}`",
                  f"- New entries: `{entries_obs}/{entries_req}`",
                  f"- Closed trades: `{closes_obs}/{closes_req}`",
                  f"- Alert level: `{alert_level}`",
                  f"- Summary: {summary}",
                  "",
                  "## No-Trade Diagnostic",
                  f"- Blocked categories: `{blocked_text}`",
                  "",
                  "## Required Action",
                  "Run cadence recovery mode this week and verify scanner adaptive profile is active.",
              ]
          )

          out = Path("artifacts/devloop/weekly_cadence_kpi_issue.md")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(body + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"passed={'true' if passed else 'false'}\n")
              handle.write(f"week_start={week_start.isoformat()}\n")
          PY

      - name: Open or update fail-safe issue
        if: steps.cadence_summary.outputs.passed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const weekStart = "${{ steps.cadence_summary.outputs.week_start }}";
            const body = fs.readFileSync("artifacts/devloop/weekly_cadence_kpi_issue.md", "utf8");
            const titlePrefix = "North Star cadence KPI miss";
            const title = `${titlePrefix} - week ${weekStart}`;
            const { owner, repo } = context.repo;

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${titlePrefix}"`,
              per_page: 10,
            });

            if (existing.data.items.length > 0) {
              const issueNumber = existing.data.items[0].number;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
              core.info(`Updated existing cadence fail-safe issue #${issueNumber}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.info(`Created cadence fail-safe issue #${created.data.number}`);
            }
