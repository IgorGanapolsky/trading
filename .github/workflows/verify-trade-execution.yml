name: Verify Trade Execution

# Monitor the current paper validation workflow without treating a no-trade plan as a fill.

on:
  # Run after the active paper entry/exit workflow completes.
  workflow_run:
    workflows: ["Put Credit Validation"]
    types:
      - completed

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      date:
        description: "Date to verify (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  verify-execution:
    name: Verify Trades Executed
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install alpaca-py

      - name: Get verification date
        id: get_date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Verify trade execution
        id: verify
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_PAPER_TRADING_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_PAPER_TRADING_API_SECRET }}
          PAPER_TRADING: "true"
        run: |
          echo "🔍 Verifying trades for ${{ steps.get_date.outputs.date }}..."

          if python3 scripts/verify_trade_execution.py --date "${{ steps.get_date.outputs.date }}"; then
            echo "verification_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Trade verification PASSED"
          else
            echo "verification_passed=false" >> $GITHUB_OUTPUT
            echo "❌ Trade verification FAILED"
          fi

      - name: Check if this is a weekday
        id: check_weekday
        run: |
          DAY_OF_WEEK=$(date +%u)
          if [ "$DAY_OF_WEEK" -ge 1 ] && [ "$DAY_OF_WEEK" -le 5 ]; then
            echo "is_weekday=true" >> $GITHUB_OUTPUT
          else
            echo "is_weekday=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Weekend - trade verification skipped (expected)"
          fi

      - name: Create issue on failure (weekdays only, with deduplication)
        if: steps.verify.outputs.verification_passed == 'false' && steps.check_weekday.outputs.is_weekday == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const date = '${{ steps.get_date.outputs.date }}';
            const title = `🚨 Trade Execution Failed - ${date}`;

            // Check if issue already exists for today (deduplication)
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'trading,urgent',
              per_page: 100
            });

            const todayIssue = existingIssues.data.find(issue =>
              issue.title.includes(date) && issue.title.includes('Trade Execution Failed')
            );

            if (todayIssue) {
              console.log(`📝 Issue #${todayIssue.number} already exists for ${date} - skipping duplicate creation`);

              // Add a comment to existing issue instead
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: todayIssue.number,
                body: `🔄 **Verification re-run at ${new Date().toISOString()}**\n\nWorkflow run: ${{ github.run_id }}\nStill no trades detected.`
              });
              return;
            }

            const body = [
              '## Trade Verification Failed',
              '',
              `**Date**: ${date}`,
              `**Workflow Run**: ${{ github.run_id }}`,
              '',
              '### What Happened',
              'Put Credit Validation completed but broker verification found no matching execution evidence.',
              '',
              '### Possible Causes',
              '1. The run was exit-only, status-only, or a dry run',
              '2. Market conditions did not meet the entry criteria',
              '3. Inventory reconciliation blocked new risk',
              '4. The broker rejected or did not fill an order',
              '',
              '### Required Actions',
              `- [ ] Check [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              '- [ ] Verify Alpaca account has orders',
              '- [ ] Review `scripts/spy_put_credit.py` output',
              '- [ ] Reconcile `data/put_credit_entries.json` with broker orders',
              '',
              '---',
              '*Auto-generated by verify-trade-execution.yml*'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'trading', 'urgent']
            });

            console.log('📧 Issue created for failed trade verification');

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 TRADE VERIFICATION SUMMARY"
          echo "=========================================="
          echo "Date: ${{ steps.get_date.outputs.date }}"
          echo "Weekday: ${{ steps.check_weekday.outputs.is_weekday }}"
          echo "Verification: ${{ steps.verify.outputs.verification_passed == 'true' && '✅ PASSED' || '❌ FAILED' }}"

          if [ "${{ steps.verify.outputs.verification_passed }}" == "false" ] && [ "${{ steps.check_weekday.outputs.is_weekday }}" == "true" ]; then
            echo ""
            echo "🚨 ALERT: Trade execution verification FAILED on a weekday!"
            echo "   An issue has been created for investigation."
          fi
          echo "=========================================="
