name: Verify Trade Execution

# Monitor the current paper validation workflow without treating a no-trade plan as a fill.

on:
  # Run after the active paper entry/exit workflow completes.
  workflow_run:
    workflows: ["Put Credit Validation"]
    types:
      - completed

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      date:
        description: "Date to verify (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  verify-execution:
    name: Verify Trades Executed
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: ./.github/actions/setup-uv-python

      - name: Get verification date
        id: get_date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "date=${{ github.event.inputs.date }}" >> $GITHUB_OUTPUT
          else
            echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Verify trade execution
        id: verify
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_PAPER_TRADING_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_PAPER_TRADING_API_SECRET }}
          PAPER_TRADING: "true"
        run: |
          echo "🔍 Verifying trades for ${{ steps.get_date.outputs.date }}..."

          if python3 scripts/verify_trade_execution.py --date "${{ steps.get_date.outputs.date }}"; then
            echo "verification_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Trade verification PASSED"
          else
            echo "verification_passed=false" >> $GITHUB_OUTPUT
            echo "❌ Trade verification FAILED"
          fi

      - name: Check if this is a weekday
        id: check_weekday
        run: |
          DAY_OF_WEEK=$(date +%u)
          if [ "$DAY_OF_WEEK" -ge 1 ] && [ "$DAY_OF_WEEK" -le 5 ]; then
            echo "is_weekday=true" >> $GITHUB_OUTPUT
          else
            echo "is_weekday=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Weekend - trade verification skipped (expected)"
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 TRADE VERIFICATION SUMMARY"
          echo "=========================================="
          echo "Date: ${{ steps.get_date.outputs.date }}"
          echo "Weekday: ${{ steps.check_weekday.outputs.is_weekday }}"
          echo "Verification: ${{ steps.verify.outputs.verification_passed == 'true' && '✅ PASSED' || '❌ FAILED' }}"

          if [ "${{ steps.verify.outputs.verification_passed }}" == "false" ] && [ "${{ steps.check_weekday.outputs.is_weekday }}" == "true" ]; then
            echo ""
            echo "ℹ️ No broker fill today. Paper dry-run / regime / inventory skip is expected."
            echo "   This is not a GitHub Issue. See the Put Credit Validation run log."
          fi
          echo "=========================================="
