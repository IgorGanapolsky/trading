name: Continuous ArXiv Research Paper Ingestion

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      max_results:
        description: Maximum papers to fetch
        required: false
        default: "10"
      search_query:
        description: Optional query override
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ingest-arxiv-papers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest requests urllib3

      - name: Run ArXiv paper ingestion pipeline
        run: |
          PYTHONPATH=. python scripts/arxiv_paper_ingestion.py --max-results ${{ github.event.inputs.max_results || '10' }}

      - name: Commit and push ingested papers manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/arxiv/ data/audit/arxiv_ingestion_manifest.json data/audit/ingestion_version_manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(rag): continuous arXiv research paper ingestion [auto]" && git push)
