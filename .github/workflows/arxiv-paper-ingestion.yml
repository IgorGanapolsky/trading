name: Continuous ArXiv Research Ingest

# Pulls new arXiv papers (q-fin / ML / RAG) into Agentic RAG twice daily.
# Source: https://arxiv.org via https://export.arxiv.org/api/query
# Manual dispatch is dry-run friendly (no inputs — Checkov CKV_GHA_7).

on:
  schedule:
    # 06:00 UTC and 18:00 UTC — continuous research refresh
    - cron: 0 6 * * *
    - cron: 0 18 * * *
  workflow_dispatch:

permissions:
  contents: write # This workflow needs write access to commit and push changes to the repository
  pull-requests: read # Only read access needed for pull requests

concurrency:
  group: arxiv-paper-ingest-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Refresh to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install pytest ruff

      - name: Ingest arXiv papers into Agentic RAG
        env:
          PYTHONPATH: ${{ github.workspace }}
          RAG_WRITE_PROFILE: repo
        run: |
          set -euo pipefail
          python scripts/arxiv_paper_ingestion.py \
            --max-results 18 \
            --min-relevance 0.18 \
            --rebuild-index \
            --json | tee artifacts_arxiv_ingest.json

      - name: Upload ingest summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: arxiv-ingest-summary
          path: artifacts_arxiv_ingest.json
          if-no-files-found: ignore

      - name: Commit corpus + RAG index
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f \
            rag_knowledge/arxiv/ \
            data/audit/arxiv_ingestion_manifest.json \
            data/audit/ingestion_version_manifest.json \
            data/rag/lessons_query.json \
            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No arXiv corpus changes to commit"
            exit 0
          fi

          git commit -m "chore(rag): continuous arXiv research ingest [auto]"
          git push origin main
