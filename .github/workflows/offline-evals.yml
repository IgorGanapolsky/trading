name: Offline Evals (Regression Gate)

on:
  pull_request:
    paths:
      - src/rag/**
      - src/analytics/statistical_edge.py
      - src/bank/live_gate.py
      - src/execution/position_sizer.py
      - src/safety/**
      - src/orchestrator/gates.py
      - scripts/put_credit_cohort_scorecard.py
      - scripts/world_class_trading_readiness.py
      - tests/evals/**
      - tests/test_rag_*.py
      - tests/test_live_gate_evals.py
      - tests/test_position_sizer.py
      - tests/test_put_credit_cohort_scorecard.py
      - .github/workflows/offline-evals.yml
  push:
    branches: [main]
    paths:
      - src/rag/**
      - src/analytics/statistical_edge.py
      - src/bank/live_gate.py
      - src/execution/position_sizer.py
      - src/safety/**
      - src/orchestrator/gates.py
      - scripts/put_credit_cohort_scorecard.py
      - scripts/world_class_trading_readiness.py
      - tests/evals/**
      - tests/test_rag_*.py
      - tests/test_live_gate_evals.py
      - tests/test_position_sizer.py
      - tests/test_put_credit_cohort_scorecard.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  offline-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run offline evals (deterministic)
        env:
          # Ensure optional heavy deps cannot cause network access during evals.
          HF_HUB_OFFLINE: 1
          TRANSFORMERS_OFFLINE: 1
          RAG_EMBEDDING_BACKEND: hashing
          RAG_RERANKER_MODE: heuristic
        run: |
          pytest -q \
            tests/evals \
            tests/test_mandatory_trade_gate.py \
            tests/test_orchestrator_gates.py \
            tests/test_lessons_learned_rag_smoke.py \
            tests/test_rag_pipeline.py \
            tests/test_rag_production_pipeline.py \
            tests/test_rag_evaluation.py \
            tests/test_live_gate_evals.py \
            tests/test_position_sizer.py \
            tests/test_put_credit_cohort_scorecard.py
