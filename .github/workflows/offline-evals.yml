name: Offline Evals (Regression Gate)

on:
  pull_request:
    paths:
      - "src/rag/**"
      - "src/safety/**"
      - "src/orchestrator/gates.py"
      - "tests/evals/**"
      - ".github/workflows/offline-evals.yml"
  push:
    branches: [main]
    paths:
      - "src/rag/**"
      - "src/safety/**"
      - "src/orchestrator/gates.py"
      - "tests/evals/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  offline-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: ./.github/actions/setup-uv-python
        with:
          extra: dev

      - name: Run offline evals (deterministic)
        env:
          # Ensure optional heavy deps cannot cause network access during evals.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          pytest -q \
            tests/evals \
            tests/test_mandatory_trade_gate.py \
            tests/test_orchestrator_gates.py \
            tests/test_lessons_learned_rag_smoke.py \
            tests/test_graph_rag.py

      - name: Graph RAG rebuild + golden multi-hop gate
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python scripts/verify_graph_rag.py --json
