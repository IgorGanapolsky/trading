name: OpenSSF Scorecard

# Supply-chain security scanner from OpenSSF. Surfaces issues like
# unpinned actions, missing branch protection, lack of code review,
# token permissions, dependency pinning, and signed releases.
# Runs weekly + on default-branch push so the score reflects current
# state. Read-only by default; results uploaded to GitHub Security tab.
# Reference: https://github.com/ossf/scorecard-action

on:
  branch_protection_rule:
  schedule:
    - cron: 0 6 * * 1 # Mondays 06:00 UTC
  push:
    branches:
      - main

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code-scanning
      id-token: write # publish results via OIDC
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: results.sarif
