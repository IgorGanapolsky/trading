name: EMERGENCY Close 7 Contracts

on:
  workflow_dispatch:
  push:
    paths:
      - 'EMERGENCY_CLOSE_7.trigger'
      - '.github/workflows/emergency-close-7.yml'
  schedule:
    # Run every 2 minutes during market hours - CRISIS MODE
    - cron: '*/2 14-21 * * 1-5'

permissions:
  contents: write

jobs:
  close-7:
    name: Close 7 PDT-safe contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install alpaca-py

      - name: Close 7 Contracts
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_PAPER_TRADING_5K_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_PAPER_TRADING_5K_API_SECRET }}
        run: python scripts/emergency_close_7.py

      - name: Sync State
        if: success()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync-system-state.yml/dispatches" \
            -d '{"ref": "main"}'
